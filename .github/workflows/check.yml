# The shell holds presentation only, and these are the checks that say so.
#
# The core is fetched and cross compiled, because a shell that compiles against
# stale bindings is a shell that compiles against nothing.
name: check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: ./.github/actions/core
        with:
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}

      - name: Lint the Kotlin
        run: ./gradlew --no-daemon ktlintCheck detekt

      - name: Nothing writes to the log
        run: scripts/check-no-logging.sh

      - name: Assemble
        run: ./gradlew --no-daemon :app:assembleDebug

      # What this module decides on its own: the sentence a core failure
      # becomes, when an idle wallet locks itself, how long a copied address
      # survives, which core the build carries, and how a long value is broken
      # up to be read. The core's behaviour is tested in the core.
      - name: Tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # The release build is the one that shrinks, and the shrinker is the step
      # that fails on a dependency reaching for a class Android does not have.
      # Assembling only the debug package hides that until a release is cut.
      - name: Assemble the release package
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: The package is aligned for 16 KB pages
        run: |
          scripts/align-release.sh app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"

      - name: The app has no business asking for anything else
        run: scripts/check-manifest.sh

      - name: Nothing in the package belongs to an advertiser
        run: scripts/check-package.sh
