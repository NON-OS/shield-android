# The Rust core for this shell, built once per pinned commit and cached.
#
# The core is most of every run: the Tor stack and the prover, from source, for
# two ABIs. The libraries, the generated bindings and the generated provenance
# and licences are cached under the pinned commit and the scripts that make
# them, so a run whose core has not moved skips Rust entirely.
name: core
description: The pinned core as Android libraries and Kotlin bindings, from cache when it has not moved.
inputs:
  ssh-key:
    description: The read-only deploy key for the core repository.
    required: true
runs:
  using: composite
  steps:
    - name: The core this build is pinned to
      id: pin
      shell: bash
      run: echo "sha=$(tr -d '[:space:]' < core.lock)" >> "$GITHUB_OUTPUT"

    - name: The built core, if this commit was built before
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          app/src/main/jniLibs
          app/src/main/generated
          app/src/main/assets/core.txt
        key: core-${{ steps.pin.outputs.sha }}-${{ hashFiles('scripts/build-core.sh', 'scripts/licences.py', 'licenses/**') }}

    - uses: actions/checkout@v4
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        repository: NON-OS/shield-core
        ref: ${{ steps.pin.outputs.sha }}
        ssh-key: ${{ inputs.ssh-key }}
        path: shield-core

    - uses: taiki-e/install-action@v2
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        tool: cargo-ndk

    - name: Build the core and generate the bindings
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        NOX_SHIELD_CORE: ${{ github.workspace }}/shield-core
      run: scripts/build-core.sh
